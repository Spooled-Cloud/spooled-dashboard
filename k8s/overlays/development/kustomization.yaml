apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: spooled-dashboard-dev

resources:
  - ../../base

nameSuffix: -dev

labels:
  - includeSelectors: true
    pairs:
      environment: development

patches:
  # Reduce replicas for development
  - target:
      kind: Deployment
      name: spooled-dashboard
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Reduce resource limits
  - target:
      kind: Deployment
      name: spooled-dashboard
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
  # Disable HPA in development
  - target:
      kind: HorizontalPodAutoscaler
      name: spooled-dashboard
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2

configMapGenerator:
  - name: spooled-dashboard-config
    behavior: merge
    literals:
      # GET /api/config hands these two URLs to the browser, which calls the API and opens the
      # WebSocket itself. In-cluster DNS names (*.svc.cluster.local) do not resolve there, so
      # they point at localhost; reach the dev backend and dashboard with port-forwards:
      #   kubectl -n spooled-backend-dev port-forward svc/spooled-backend-dev 3000:3000
      #   kubectl -n spooled-dashboard-dev port-forward svc/spooled-dashboard-dev 4321:80
      # then open http://localhost:4321. Behind an ingress, set your public API URLs instead.
      - PUBLIC_API_URL=http://localhost:3000
      - PUBLIC_WS_URL=ws://localhost:3000
      - PUBLIC_SENTRY_ENVIRONMENT=development
